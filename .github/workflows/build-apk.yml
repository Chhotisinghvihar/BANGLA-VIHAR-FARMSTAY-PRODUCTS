name: Build Bangla Vihar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Android project
        shell: bash
        run: |
          mkdir -p /tmp/bv
          cat > /tmp/bv/project.b64 <<'EOF'
[...]
EOF

          base64 -d /tmp/bv/project.b64 > /tmp/bv/project.zip
          unzip -q /tmp/bv/project.zip -d /tmp/bv/unpacked
          cp -a /tmp/bv/unpacked/Bangla-Vihar-Android/. "$GITHUB_WORKSPACE/"
          rm -rf /tmp/bv

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Vihar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
